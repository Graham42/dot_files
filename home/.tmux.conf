# ~/.tmux.conf

###########################################################################
# Remap prefix from default (C-b) to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

###########################################################################
# General options

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable OSC 52 clipboard support for sharing clipboard over SSH
set -g set-clipboard on
if-shell 'tmux -V | grep -qE "tmux [4-9]|tmux 3\.[2-9]"' \
    'set -sa terminal-features ",xterm-256color:clipboard"'
# - When you select and copy text in tmux's copy mode, tmux itself emits OSC52
#   escape sequences to your terminal.
# - Assuming your terminal supports it (e.g., iTerm2, ghostty), it receives the
#   OSC52 sequence and writes it to your local macOS clipboard.
# - This works over SSH because OSC52 travels through the SSH connection back
#   to your local terminal. There's no special clipboard protocol involved. It's
#   just terminal output.
# NOTE: before tmux 3.3 there were some issues with this so we need the tmux-yank plugin

# scrollback size
set -g history-limit 50000

# pass through xterm keys (allow ctrl left, right etc)
set -g xterm-keys on

# Use vim like keys
# for tmux-yank
set -g @shell_mode 'vi'
set -g mode-keys vi

# If on a OLDER Mac...
# if-shell 'test "$(uname -s)" = Darwin' 'set-option -g default-command "exec reattach-to-user-namespace -l bash"'

# enable mouse scrolling
set -g mouse on

# Use smallest client's dimensions (avoids window being constrained by a smaller attached client)
set-window-option -g window-size smallest

###########################################################################
# Pane titles and window naming

# Show pane title bar at the top of each pane
set -g pane-border-status top

# Prevent shells from renaming windows via escape sequences.
# OSC 2 sequences still set the pane title — only window renaming is blocked.
set -g allow-rename off

# Pane border format: highlight active pane in green, show index and title
set -g pane-border-format "#{?pane_active,#[fg=green],#[fg=white]} #{pane_index} #{pane_title} "

# To set a pane title:
#   tmux command:    tmux select-pane -T "my title"
#   escape sequence: printf '\033]2;my title\007'  (works from inside the pane)

###########################################################################
# General keymap

# reload tmux config
unbind r
bind r \
    source-file ~/.tmux.conf \;\
    display 'Reloaded tmux config.'

# Track window visits, not terminal output. A counter keeps rapid visits ordered.
# Use a fixed hook index so reloads preserve other hooks without adding duplicates.
set-hook -g session-window-changed[100] 'set-option -gF @mru_sequence "#{e|+:#{?@mru_sequence,#{@mru_sequence},0},1}" ; set-option -wF @mru_access "#{@mru_sequence}"'
set-hook -g client-session-changed[100] 'set-option -gF @mru_sequence "#{e|+:#{?@mru_sequence,#{@mru_sequence},0},1}" ; set-option -wF @mru_access "#{@mru_sequence}"'
set-hook -g client-attached[100] 'set-option -gF @mru_sequence "#{e|+:#{?@mru_sequence,#{@mru_sequence},0},1}" ; set-option -wF @mru_access "#{@mru_sequence}"'

# fzf window switcher (most recently accessed first)
bind C-t run-shell -b "~/.tmux/mru-windows.sh '#{session_id}:#{window_id}'"
# Return to the previous visited window, including across sessions.
bind l run-shell -b "~/.tmux/mru-windows.sh '#{session_id}:#{window_id}' --previous"

# open panes in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

###########################################################################
# Plugins
# To install plugins:  prefix + I
# To update plugins:   prefix + U
# To remove plugins:   prefix + alt + u  (removes unlisted plugins)

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
# Theme
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'double/cyan'
# Share clipboard with system
set -g @plugin 'tmux-plugins/tmux-yank'
# Fuzzy finder integration
set -g @plugin 'sainnhe/tmux-fzf'
# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'
# Save and restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# Restore: prefix, then Option+Shift+R (Mac) / Alt+Shift+R (Linux)
set -g @resurrect-restore 'M-R'
set -g @plugin 'tmux-plugins/tmux-continuum'

# start the plugin manager, must be at bottom of conf file
run '~/.tmux/plugins/tpm/tpm'
